[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://house:house@127.0.0.1:3306/house_design?charset=utf8mb4

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
