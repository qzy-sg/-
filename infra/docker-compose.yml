services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATA_DIR: /data/store
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-not-for-production-key!!
      USE_MOCK_AI: "true"
      USE_MOCK_STORAGE: "false"
      TASK_INLINE: "false"
      SEED_DEMO: "true"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: house-design
    ports:
      - "8000:8000"
    volumes:
      - house_data:/data/store
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      DATA_DIR: /data/store
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_AI: "true"
      USE_MOCK_STORAGE: "false"
      TASK_INLINE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: house-design
    volumes:
      - house_data:/data/store
    depends_on:
      redis:
        condition: service_healthy

volumes:
  house_data:
  minio_data:
